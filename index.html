<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOL Manager Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
    <div class="background">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="container">
        <header class="glass">
            <div class="logo">
                <h1>Wake on LAN<span> Remote</span></h1>
                <p id="status-text">Đang kết nối MQTT...</p>
            </div>
            <div class="header-actions">
                <button id="settings-btn" class="btn-icon" title="Cài đặt">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button id="add-btn" class="btn-icon" title="Thêm máy">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
        </header>

        <section class="system-stats glass">
            <div class="stat">
                <span class="label">Uptime</span>
                <span id="uptime" class="value">--</span>
            </div>
            <div class="stat">
                <span class="label">Signal</span>
                <span id="rssi" class="value">--</span>
            </div>
            <div class="stat">
                <span class="label">Free RAM</span>
                <span id="heap" class="value">--</span>
            </div>
        </section>

        <div class="section-header">
            <h2>Thiết bị của bạn</h2>
        </div>

        <div id="device-list" class="device-grid">
            <div class="loading">Đang đợi ESP32 phản hồi...</div>
        </div>

        <footer>
            <p>ESP32-C3 WoL Dashboard &copy; nghiapdpers 2026</p>
        </footer>
    </div>

    <!-- Modal Thêm Máy -->
    <div id="modal" class="modal">
        <div class="modal-content glass">
            <h3>Thêm thiết bị mới</h3>
            <input type="text" id="pc-name" placeholder="Tên máy tính (VD: PC Gaming)">
            <input type="text" id="pc-mac" placeholder="Địa chỉ MAC (00:1A:2B:...)">
            <div class="modal-actions">
                <button id="cancel-btn" class="btn-secondary">Hủy</button>
                <button id="save-btn" class="btn-primary">Lưu thiết bị</button>
            </div>
        </div>
    </div>

    <!-- Modal Cài đặt (Secret Key) -->
    <div id="settings-modal" class="modal">
        <div class="modal-content glass">
            <h3>Cấu hình Remote</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 1.5rem;">
                Nhập Secret Key trùng với ESP32 để đồng bộ dữ liệu qua MQTT.
            </p>
            <input type="password" id="secret-key" placeholder="Nhập MQTT Secret Key">
            <div class="modal-actions">
                <button id="settings-close-btn" class="btn-primary">Kết nối & Lưu</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
