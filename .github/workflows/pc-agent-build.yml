name: Build PC Agent

on:
  push:
    branches: [ main ]
    paths:
      - 'pc-agent/**'
  workflow_dispatch: # Cho phép bấm nút build thủ công

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: pc_agent_windows.exe
          - os: ubuntu-latest
            artifact_name: pc_agent_linux

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pc-agent/requirements.txt

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --noconsole --name pc_agent_windows pc-agent/src/agent.py

    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --onefile --name pc_agent_linux pc-agent/src/agent.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          # Di chuyển các file từ thư mục artifact ra thư mục release_files để upload lên Release
          find artifacts -type f -exec cp {} release_files/ \;
          ls -R release_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Build Release #${{ github.run_number }}"
          draft: false
          prerelease: false
          files: |
            release_files/pc_agent_windows.exe
            release_files/pc_agent_linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
